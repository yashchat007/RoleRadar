services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: roleradar
      POSTGRES_PASSWORD: roleradar
      POSTGRES_DB: roleradar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  pgdata:
